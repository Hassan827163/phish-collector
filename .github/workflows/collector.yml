name: collector

on:
  workflow_dispatch:            # cron-job.org har 15 minute yahi trigger karega
  schedule:
    - cron: "*/30 * * * *"      # backup, agar cron-job.org ruk jaye (GitHub ka schedule late hota hai)

concurrency:
  group: collector
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Code checkout (phish-collector)
        uses: actions/checkout@v4

      - name: Data checkout (private phish-data)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/phish-data
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: data

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests dnspython tldextract tranco

      - name: Run collector
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
          DATA_DIR: data
        run: python collector.py

      - name: Save data to phish-data
        if: always()
        working-directory: data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "collector data $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull --rebase --quiet && git push && break
            sleep 5
          done
