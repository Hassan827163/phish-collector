name: pilot

on:
  schedule:
    - cron: "7 */2 * * *"     # har 2 ghante (UTC); GitHub kabhi thoda late chalata hai
  workflow_dispatch:           # "Run workflow" button se khud bhi chala sakte hain

concurrency:
  group: pilot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Code checkout (phish-collector)
        uses: actions/checkout@v4

      - name: Data checkout (private phish-data)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/phish-data
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: data

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Run pilot
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
          DATA_DIR: data
        run: python pilot.py

      - name: Save data to phish-data
        if: always()
        working-directory: data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "pilot data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
