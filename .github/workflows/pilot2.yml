name: pilot2

on:
  workflow_dispatch:            # cron-job.org har 15 minute yahi trigger karega
  schedule:
    - cron: "*/30 * * * *"      # backup: agar cron-job.org ruk jaye (GitHub ka schedule late hota hai)

concurrency:
  group: pilot2
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Code checkout (phish-collector)
        uses: actions/checkout@v4

      - name: Data checkout (private phish-data)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/phish-data
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: data

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Run pilot 2
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
          URLSCAN_API_KEY: ${{ secrets.URLSCAN_API_KEY }}
          URLHAUS_KEY: ${{ secrets.URLHAUS_KEY }}
          DATA_DIR: data
        run: python pilot2.py

      - name: Save data to phish-data
        if: always()
        working-directory: data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "pilot2 data $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --quiet || true
          git push
